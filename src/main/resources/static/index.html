<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes API</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Railway + Spring Boot</p>
        <h1>Clientes</h1>
      </div>
      <a class="api-link" href="/api/clientes" target="_blank" rel="noreferrer">
        <i data-lucide="braces"></i>
        API
      </a>
    </header>

    <main class="layout">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Registro</p>
            <h2 id="form-title">Nuevo cliente</h2>
          </div>
          <button class="icon-button ghost" id="resetButton" type="button" title="Limpiar formulario" aria-label="Limpiar formulario">
            <i data-lucide="rotate-ccw"></i>
          </button>
        </div>

        <form id="clienteForm" novalidate>
          <input type="hidden" id="clienteId">

          <label>
            Nombre
            <input id="nombre" name="nombre" type="text" maxlength="120" required autocomplete="name" placeholder="Ana Perez">
          </label>

          <label>
            Email
            <input id="email" name="email" type="email" maxlength="160" required autocomplete="email" placeholder="ana.perez@example.com">
          </label>

          <label>
            Telefono
            <input id="telefono" name="telefono" type="tel" maxlength="30" autocomplete="tel" placeholder="+57 300 123 4567">
          </label>

          <label>
            Direccion
            <textarea id="direccion" name="direccion" maxlength="255" rows="4" placeholder="Calle 123 #45-67"></textarea>
          </label>

          <button class="primary-button" id="submitButton" type="submit">
            <i data-lucide="save"></i>
            Guardar cliente
          </button>
        </form>
      </section>

      <section class="panel table-panel" aria-labelledby="list-title">
        <div class="panel-heading list-heading">
          <div>
            <p class="eyebrow">Base de datos</p>
            <h2 id="list-title">Clientes guardados</h2>
          </div>
          <div class="toolbar">
            <label class="search">
              <i data-lucide="search"></i>
              <input id="searchInput" type="search" placeholder="Buscar cliente">
            </label>
            <button class="icon-button" id="refreshButton" type="button" title="Actualizar lista" aria-label="Actualizar lista">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
        </div>

        <div class="status-row">
          <span id="statusText">Cargando clientes...</span>
          <span id="countBadge" class="count-badge">0</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Direccion</th>
                <th class="actions-col">Acciones</th>
              </tr>
            </thead>
            <tbody id="clientesBody"></tbody>
          </table>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <i data-lucide="users-round"></i>
          <p>No hay clientes para mostrar.</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
